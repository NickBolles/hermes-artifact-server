services:
  hermes-artifacts:
    build: .
    image: hermes-artifact-server:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BASE_URL: "https://artifacts.example.com"
      ARTIFACT_ROOT: "/data/artifacts"
      API_TOKEN: "change-me-long-random-api-token"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "change-me-long-random-admin-password"
      TRUST_PROXY: "true"
      MAX_UPLOAD_BYTES: "52428800"
    volumes:
      - ./artifacts:/data/artifacts
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
